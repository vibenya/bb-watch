name: BBWatch
options:
  bundleIdPrefix: dev.tokenville
  deploymentTarget:
    watchOS: "26.0"
  createIntermediateGroups: true

targets:
  BBWatch:
    type: application
    platform: watchOS
    deploymentTarget: "26.0"
    sources:
      - path: Sources/BBWatch
      - path: Sources/BBWatchCore
    dependencies:
      - target: BBWatchComplication
    info:
      path: Info.plist
      properties:
        NSMicrophoneUsageDescription: "BB uses the microphone to record messages for your agent."
        UIBackgroundModes: [audio]
        WKWatchOnly: true
        WKApplication: true
        CFBundleURLTypes:
          - CFBundleURLName: dev.tokenville.bbwatch
            CFBundleURLSchemes: [bbwatch]
        CFBundleDevelopmentRegion: en
        CFBundleDisplayName: BB
        CFBundleShortVersionString: $(MARKETING_VERSION)
        CFBundleVersion: $(CURRENT_PROJECT_VERSION)
    settings:
      base:
        ASSETCATALOG_COMPILER_APPICON_NAME: AppIcon
        ASSETCATALOG_COMPILER_GLOBAL_ACCENT_COLOR_NAME: AccentColor
        PRODUCT_BUNDLE_IDENTIFIER: dev.tokenville.bbwatch
        MARKETING_VERSION: 0.2.0
        CURRENT_PROJECT_VERSION: 2
        INFOPLIST_KEY_NSMicrophoneUsageDescription: "BB uses the microphone to record messages for your agent."
        CODE_SIGN_STYLE: Automatic
  BBWatchComplication:
    type: app-extension
    platform: watchOS
    deploymentTarget: "26.0"
    sources:
      - path: Sources/BBWatchComplication
      - path: Sources/BBWatch/Assets.xcassets
    info:
      path: Sources/BBWatchComplication/Info.plist
      properties:
        CFBundleDisplayName: BB
        CFBundleShortVersionString: $(MARKETING_VERSION)
        CFBundleVersion: $(CURRENT_PROJECT_VERSION)
        NSExtension:
          NSExtensionPointIdentifier: com.apple.widgetkit-extension
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: dev.tokenville.bbwatch.complication
        MARKETING_VERSION: 0.2.0
        CURRENT_PROJECT_VERSION: 2
        CODE_SIGN_STYLE: Automatic
        SKIP_INSTALL: YES
  BBWatchUITests:
    type: bundle.ui-testing
    platform: watchOS
    deploymentTarget: "26.0"
    sources:
      - path: UITests
    dependencies:
      - target: BBWatch
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: dev.tokenville.bbwatch.uitests
        TEST_TARGET_NAME: BBWatch
        GENERATE_INFOPLIST_FILE: YES
        CODE_SIGN_STYLE: Automatic
schemes:
  BBWatch:
    build:
      targets:
        BBWatch: all
        BBWatchUITests: [test]
    run:
      config: Debug
    test:
      config: Debug
      targets:
        - BBWatchUITests
